  <title>blockdiag</title>
  <desc>actdiag {
  browse -&gt; select -&gt; send -&gt; mix -&gt; control
  control -&gt; status -&gt; update -&gt; take

  lane user {
    label = "User"
    browse [label = "Browse Cocktail List"];
    select [label = "Select Cocktail"];
    take [label = "Cheers!"];
  }
  lane ui {
    label = "JiggerU"
    send [label = "Send Recipe"];
    update
  }
  lane hal{
    label = "HAL implementation"
    mix [label = "Get Request"];
    status
  }
  lane hardware {
    label = "Miximus Prime"
    control [label = "Control Hardware"];
  }
}
</desc>
