name: Kroki Render

on:
  push:
    paths:
      - 'diagrams/**'

jobs:
  kroki-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render diagrams via Kroki API
        run: |
          mkdir -p images
          for file in diagrams/*; do
            ext="${file##*.}"
            name="$(basename "${file%.*}")"
            case "$ext" in
              diag|blockdiag) type="blockdiag" ;;
              excalidraw)     type="excalidraw" ;;
              puml|plantuml)  type="plantuml" ;;
              mermaid)        type="mermaid" ;;
              *)              echo "Skipping unknown type: $file"; continue ;;
            esac
            echo "Rendering $file ($type) -> images/${name}.svg"
            curl -sf -X POST "https://kroki.io/${type}/svg" \
              -H "Content-Type: text/plain" \
              --data-binary @"$file" \
              -o "images/${name}.svg"
          done

      - name: Commit & Push changes
        run: |
          git config --local user.email "crjeder@gmail.com"
          git config --local user.name "GitHub Action"
          git add images/*.svg
          git commit -m "Update diagrams via Kroki" || exit 0
          git push
